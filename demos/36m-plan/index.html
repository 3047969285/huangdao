<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>36个月 · 1008天对照表</title>
  <style>
    :root {
      --bg: #111; --panel: #1a1a1a; --line: #333;
      --text: #f2f2f2; --mute: #9a9a9a; --acc: #3d8bfd; --ok: #3dd68c; --warn: #f5a524;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      line-height: 1.55; padding: 12px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 4px; }
    .sub { color: var(--mute); font-size: 0.84rem; margin-bottom: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
    label { font-size: 0.8rem; color: var(--mute); }
    select, button {
      font: inherit; background: var(--panel); color: var(--text);
      border: 1px solid var(--line); padding: 8px 10px; border-radius: 6px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 12px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .side, .main {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px;
    }
    .day-list { display: grid; gap: 6px; max-height: 72vh; overflow: auto; }
    .day-btn {
      text-align: left; width: 100%; padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--line); background: #141414;
    }
    .day-btn.is-on { border-color: var(--acc); background: #1c2a3f; }
    .day-btn small { display: block; color: var(--mute); font-size: 0.75rem; }
    .block {
      border: 1px solid var(--line); border-radius: 8px;
      padding: 12px; margin-bottom: 10px; background: #141414;
    }
    .block h3 { font-size: 0.95rem; margin-bottom: 8px; }
    .time { color: var(--acc); font-weight: 700; font-size: 0.8rem; margin-right: 6px; }
    .check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; }
    .check input { margin-top: 4px; }
    .bili {
      display: inline-block; margin: 8px 6px 0 0; padding: 6px 10px;
      background: #00a1d6; color: #fff; border-radius: 6px;
      text-decoration: none; font-size: 0.82rem; font-weight: 600;
    }
    .bili.alt { background: #444; }
    .tip { color: #cfcfcf; font-size: 0.84rem; margin-top: 6px; }
    .title-line { font-size: 1.08rem; font-weight: 700; }
    .meta { color: var(--mute); font-size: 0.82rem; margin: 6px 0 12px; }
    .warn { color: var(--warn); }
    .err { color: #ff6b6b; padding: 20px; }
  </style>
</head>
<body>
  <h1>36个月 · 每天干什么（1008天全写清）</h1>
  <p class="sub">每一天都有独立「学什么 / 做什么 / B站搜什么」。选月份→周→星期几。勾选进度保存在本机。</p>

  <div class="row">
    <label>月份 <select id="monthSel"></select></label>
    <label>周
      <select id="weekSel">
        <option value="0">第1周</option>
        <option value="1">第2周</option>
        <option value="2">第3周</option>
        <option value="3">第4周</option>
      </select>
    </label>
    <button type="button" class="primary" id="btnReset">回到第1月·第1周·周一</button>
  </div>

  <div class="layout">
    <aside class="side">
      <div style="font-size:0.85rem;color:var(--mute);margin-bottom:8px">本周七天</div>
      <div class="day-list" id="dayList"></div>
    </aside>
    <main class="main" id="main"><div class="err">正在加载 1008 天数据…</div></main>
  </div>

  <script src="./days-data.js"></script>
  <script>
    (function () {
      var DAYS = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
      var MONTH_META = [
        ["JVM Runtime", ["Bytecode入口", "Runtime内存区", "解释器与JIT", "GC与月仓库"]],
        ["CPU & Memory", ["Cache层次", "流水线与分支", "SIMD与并行", "Memory Ordering报告"]],
        ["Operating Systems", ["进程线程", "虚拟内存", "文件系统与IO", "Mini Shell"]],
        ["Concurrency", ["JMM可见性", "CAS与AQS", "线程池", "Mini ThreadPool"]],
        ["Database Internals", ["B+Tree", "LSM与WAL", "MVCC事务", "Mini KV"]],
        ["Networking", ["TCPIP", "Socket编程", "epoll Reactor", "Mini HTTP"]],
        ["Distributed I", ["故障模型", "复制", "CAP一致性", "Replicated KV"]],
        ["Distributed II", ["Raft选主", "日志复制", "快照", "Mini Raft"]],
        ["Programming Languages", ["词法分析", "语法与AST", "类型与解释", "Mini Language"]],
        ["Compiler & Runtime", ["中间表示IR", "优化", "字节码VM", "Mini VM"]],
        ["Security", ["认证授权", "密码学基础", "TLS与Web安全", "Security Lab"]],
        ["Cloud Reliability", ["可观测性", "SLO", "追踪与故障注入", "可靠性实验"]],
        ["Linear Algebra", ["向量矩阵", "特征值", "SVD", "Tensor笔记"]],
        ["Probability", ["分布", "Bayes", "MLE", "统计实验"]],
        ["Calculus Opt", ["梯度", "链式法则", "SGD", "手写Adam"]],
        ["Machine Learning", ["回归", "树与SVM", "聚类", "from scratch"]],
        ["Neural Networks", ["反向传播", "初始化", "归一化", "Mini NN"]],
        ["PyTorch", ["Tensor", "Autograd", "Module与Data", "训练循环"]],
        ["Sequence Models", ["CNN", "RNN", "LSTM", "Attention前史"]],
        ["Transformer", ["Attention", "多头注意力", "位置编码", "Mini Transformer"]],
        ["LLM Training", ["Tokenizer", "预训练", "Scaling", "Tiny LLM"]],
        ["Fine-tuning", ["SFT", "LoRA PEFT", "数据清洗", "Preference"]],
        ["LLM Inference", ["KV Cache", "量化", "Batching", "Serving"]],
        ["Evaluation", ["Benchmark", "数据污染", "LLM-as-Judge", "Harness"]],
        ["RAG", ["切分", "Embedding", "检索", "RAG Engine"]],
        ["Advanced Retrieval", ["混合检索", "Graph", "查询改写", "Agentic"]],
        ["Agent Systems", ["Tool Use", "Planning", "Memory", "Runtime"]],
        ["Agent Reliability", ["沙箱", "重试幂等", "追踪", "Eval"]],
        ["AI Infrastructure", ["GPU概念", "CUDA入门", "Serving", "观测"]],
        ["Distributed AI", ["数据并行", "模型并行", "通信", "实验"]],
        ["Multimodal", ["Vision-Language", "Audio", "多模态Token", "实验"]],
        ["Reasoning RL", ["RL基础", "Preference", "Reasoning", "Search"]],
        ["Research Repro I", ["选题", "环境复现", "主实验", "统计"]],
        ["Research Repro II", ["改变量", "消融", "负结果", "写作"]],
        ["Original System", ["问题定义", "设计", "实现", "评估"]],
        ["Research Summary", ["报告提纲", "写作", "开源整理", "演示答辩"]]
      ];

      if (!window.PLAN36_DAYS) {
        document.getElementById("main").innerHTML =
          "<div class='err'>加载失败：请确认同目录有 <code>days-data.js</code>，并和本页放在一起打开。<br/>路径应为 Desktop\\36m-plan\\index.html</div>";
        return;
      }

      var DATA = window.PLAN36_DAYS;
      var n = Object.keys(DATA).length;
      if (n < 1008) {
        console.warn("days count", n);
      }

      function food(d) {
        if (d === 5) return "周六：午餐杂粮+肉菜；下午茶坚果/水果；禁止奶茶续命。";
        if (d === 6) return "周日：家常菜，早点睡，晚饭七分饱。";
        return "18:00–20:00 清淡晚饭（鱼/鸡/豆腐+蔬菜+少量主食）。学习饿了再吃酸奶/香蕉/原味坚果。";
      }

      function biliUrl(q) {
        return "https://search.bilibili.com/all?keyword=" + encodeURIComponent(q);
      }

      function getDay(m, w, d) {
        var key = m + "-" + w + "-" + d;
        var fixed = DATA[key];
        if (!fixed) {
          return {
            deep: "数据缺失 " + key,
            lab: "请检查 days-data.js",
            bili: "学习方法",
            bili2: "笔记方法"
          };
        }
        return fixed;
      }

      function buildSlots(m, w, d) {
        var fixed = getDay(m, w, d);
        var meta = MONTH_META[m];
        var weekTheme = meta[1][w];
        var slots;

        if (d === 5) {
          slots = [
            {
              time: "09:30–12:00",
              title: "上午工程（只做本周主题）",
              steps: [fixed.deep, "每50分钟休息5分钟", "禁止开新需求"],
              bili: fixed.bili,
              tip: "卡住才搜；只看1集相关内容"
            },
            {
              time: "12:00–14:00",
              title: "吃饭休息",
              steps: [food(5)],
              bili: null
            },
            {
              time: "14:00–17:00",
              title: "测通 + 总结提交",
              steps: [fixed.lab, "17:00前 Git 提交"],
              bili: fixed.bili2,
              tip: "为写代码服务，不是追剧"
            }
          ];
        } else if (d === 6) {
          slots = [
            {
              time: "10:00–11:30",
              title: "复盘（不学新章节）",
              steps: [fixed.deep],
              bili: null
            },
            {
              time: "11:30–14:00",
              title: "午饭休息",
              steps: [food(6)],
              bili: null
            },
            {
              time: "14:00–16:00",
              title: "英语 / 整理 / 安排下周",
              steps: [fixed.lab],
              bili: fixed.bili,
              tip: "英语日少看技术推荐"
            }
          ];
        } else {
          slots = [
            {
              time: "18:00–20:00",
              title: "下班切换（禁止学习）",
              steps: [food(d)],
              bili: null
            },
            {
              time: "20:00–20:15",
              title: "准备",
              steps: ["打开本月仓库", "手机离桌 / 静音", "倒温水"],
              bili: null
            },
            {
              time: "20:15–21:15",
              title: "深度学习（唯一主线）",
              steps: [fixed.deep, "计时到点就停"],
              bili: fixed.bili,
              tip: "点蓝按钮搜索 → 选高播放合集 → 只看1集（约20–35分钟）→ 立刻暂停推荐，余下时间自己做"
            },
            {
              time: "21:15–21:30",
              title: "离开屏幕",
              steps: ["走动/拉伸，不准刷短视频"],
              bili: null
            },
            {
              time: "21:30–22:30",
              title: "实验 / 代码 / 输出",
              steps: [fixed.lab],
              bili: fixed.bili2,
              tip: "为完成产出再搜；搜完关掉推荐"
            },
            {
              time: "22:30–22:45",
              title: "三句话日记",
              steps: ["1.搞懂：___", "2.产出文件/commit：___", "3.明天第一件事：___"],
              bili: null
            },
            {
              time: "22:45 后",
              title: "睡觉",
              steps: ["没做完挪到本周六上午，禁止熬夜硬补"],
              bili: null
            }
          ];
        }

        return {
          id: "M" + (m + 1) + "-W" + (w + 1) + "-" + DAYS[d],
          monthTitle: meta[0],
          weekTheme: weekTheme,
          slots: slots
        };
      }

      var monthSel = document.getElementById("monthSel");
      var weekSel = document.getElementById("weekSel");
      var dayList = document.getElementById("dayList");
      var main = document.getElementById("main");
      var curDay = 0;

      for (var i = 0; i < 36; i++) {
        var opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = "第" + (i + 1) + "月 · " + MONTH_META[i][0] + "（28天全写清）";
        monthSel.appendChild(opt);
      }

      function renderDayList() {
        dayList.innerHTML = "";
        var m = +monthSel.value;
        var w = +weekSel.value;
        for (var d = 0; d < 7; d++) {
          var p = buildSlots(m, w, d);
          var b = document.createElement("button");
          b.type = "button";
          b.className = "day-btn" + (d === curDay ? " is-on" : "");
          b.innerHTML = "<strong>" + DAYS[d] + "</strong><small>" + p.weekTheme + "</small>";
          (function (dd) {
            b.addEventListener("click", function () {
              curDay = dd;
              renderDayList();
              renderMain();
            });
          })(d);
          dayList.appendChild(b);
        }
      }

      function renderMain() {
        var m = +monthSel.value;
        var w = +weekSel.value;
        var plan = buildSlots(m, w, curDay);
        var key = m + "-" + w + "-" + curDay;
        var html = "";
        html += "<div class='title-line'>" + plan.id + " · " + plan.monthTitle + "</div>";
        html += "<div class='meta'>数据键 <code>" + key + "</code>　｜　本周主题：<b style='color:#fff'>" + plan.weekTheme + "</b>　｜　全库 " + n + " 天</div>";

        plan.slots.forEach(function (s, idx) {
          html += "<div class='block'><h3><span class='time'>" + s.time + "</span>" + s.title + "</h3>";
          s.steps.forEach(function (step, j) {
            var id = plan.id + "-" + idx + "-" + j;
            html += "<label class='check'><input type='checkbox' data-k='" + id + "'><span>" + step + "</span></label>";
          });
          if (s.bili) {
            html += "<div><a class='bili' target='_blank' rel='noopener' href='" + biliUrl(s.bili) + "'>B站搜索：" + s.bili + "</a>";
            if (s.bili !== plan.slots[idx].bili) { /* noop */ }
            html += "</div>";
            if (s.tip) html += "<div class='tip'>" + s.tip + "</div>";
          }
          html += "</div>";
        });

        /* 额外给第二天搜词按钮，方便 */
        var fixed = getDay(m, w, curDay);
        html += "<div class='block'><h3>今日 B站两个入口（都要点）</h3>";
        html += "<a class='bili' target='_blank' rel='noopener' href='" + biliUrl(fixed.bili) + "'>主搜：" + fixed.bili + "</a>";
        html += "<a class='bili alt' target='_blank' rel='noopener' href='" + biliUrl(fixed.bili2) + "'>备搜：" + fixed.bili2 + "</a>";
        html += "<div class='tip warn'>只看与今天任务直接相关的 1 集，禁止连播。看完立刻回来做产出。</div></div>";

        html += "<div class='block'><h3>今天最低验收</h3><ul style='padding-left:1.2rem'>";
        html += "<li>有笔记/图 或 可运行代码/实验记录</li>";
        html += "<li>Git 提交或三句话日记已写</li>";
        html += "<li class='warn'>没做完 → 挪周六上午，不熬夜</li></ul></div>";

        main.innerHTML = html;
        main.querySelectorAll("input[type=checkbox]").forEach(function (box) {
          var k = box.getAttribute("data-k");
          box.checked = localStorage.getItem("plan36:" + k) === "1";
          box.addEventListener("change", function () {
            localStorage.setItem("plan36:" + k, box.checked ? "1" : "0");
          });
        });
      }

      monthSel.addEventListener("change", function () { curDay = 0; renderDayList(); renderMain(); });
      weekSel.addEventListener("change", function () { curDay = 0; renderDayList(); renderMain(); });
      document.getElementById("btnReset").addEventListener("click", function () {
        monthSel.value = "0"; weekSel.value = "0"; curDay = 0;
        renderDayList(); renderMain();
      });

      renderDayList();
      renderMain();
    })();
  </script>
</body>
</html>
